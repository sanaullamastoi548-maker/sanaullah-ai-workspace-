<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanullah Workspace | Language Tool</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* Main Card */
        .language-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 45px 35px;
            max-width: 550px;
            width: 90%;
            margin: 30px auto;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* Header */
        .header h1 {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ffcc00);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 16px;
            color: #ccc;
            margin-top: 10px;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .glow-line {
            width: 80px;
            height: 2px;
            background: #ffcc00;
            margin: 15px auto;
            border-radius: 5px;
        }

        /* Title */
        .section-title {
            color: #ffcc00;
            font-size: 22px;
            margin: 25px 0 20px;
            font-weight: 600;
        }

        /* Search Box */
        .search-box {
            margin-bottom: 25px;
            position: relative;
        }
        #language-search {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #ffcc00;
            border-radius: 50px;
            font-size: 16px;
            background: rgba(0,0,0,0.5);
            color: white;
            outline: none;
            text-align: center;
            transition: 0.3s;
        }
        #language-search:focus {
            border-color: #fff;
            box-shadow: 0 0 12px rgba(255,204,0,0.4);
        }
        #language-search::placeholder {
            color: #aaa;
            font-size: 14px;
        }

        /* Status Message */
        .status-msg {
            margin-top: 10px;
            font-size: 12px;
            padding: 8px;
            border-radius: 20px;
            display: inline-block;
            transition: 0.3s;
        }
        .status-success {
            background: rgba(0,255,100,0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .status-error {
            background: rgba(255,50,50,0.2);
            color: #ff6666;
            border: 1px solid #ff6666;
        }
        .status-info {
            background: rgba(255,204,0,0.2);
            color: #ffcc00;
            border: 1px solid #ffcc00;
        }

        /* Select Dropdown */
        .select-box {
            margin-bottom: 30px;
        }
        language-section { background: #ffffff; padding: 20px; text-align: center; border-bottom: 2px solid #3498db; }
        #language-search { padding: 12px; width: 300px; border: 2px solid #3498db; border-radius: 8px; font-size: 16px; margin-bottom: 10px; }
        
        .container { max-width: 1000px; margin: 20px auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        
        .tool-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid #3498db; transition: 0.3s; }
        .tool-card:hover { transform: translateY(-5px); }

        /* Powered By */
        .powered {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }
        .powered span {
            color: #ffcc00;
        }

        /* Copy Button */
        .copy-btn {
            background: #ffcc00;
            color: black;
            border: none;
            padding: 10px 25px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        .copy-btn:hover {
            background: #ffaa00;
            transform: scale(0.97);
        }

        /* Demo Text */
        .demo-text {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin-top: 25px;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
        }
        .copy-message {
            margin-top: 12px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="language-card">
        <!-- Header -->
        <div class="header">
            <h1>Sanullah Workspace</h1>
            <div class="glow-line"></div>
            <div class="tagline">کی مدد سے AI ، بر مشکل کام کا آسان حل</div>
        </div>

        <!-- Title -->
        
    <div class="language-section">
        <h3>🌐 اپنی زبان تلاش کریں</h3>
        <input type="text" id="language-search" placeholder="مثلاً: Urdu, Arabic, English..." onkeyup="filterLanguages()">
        <div id="google_translate_element"></div>
    </div>

        

        <!-- Powered By -->
       <script type="text/javascript">
        // گوگل ٹرانسلیٹ کا فنکشن
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element');
        }

        // سرچ بار کا فنکشن
        function filterLanguages() {
            let input = document.getElementById('language-search').value.toLowerCase();
            let select = document.querySelector('.goog-te-combo');
            if (select) {
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].text.toLowerCase().indexOf(input) > -1) {
                        select.selectedIndex = i;
                        select.dispatchEvent(new Event('change'));
                        break;
                    }
                }
            }
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script> 
    <script>
        // ========== SHOW STATUS MESSAGE (خوبصورت پیغام) ==========
        function showStatus(message, type) {
            let statusDiv = document.getElementById("searchStatus");
            statusDiv.style.display = "inline-block";
            statusDiv.innerHTML = message;
            statusDiv.className = "status-msg status-" + type;
            
            setTimeout(() => {
                statusDiv.style.display = "none";
            }, 3000);
        }

        // ========== GOOGLE TRANSLATE INIT ==========
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ur',
                autoDisplay: false,
                includedLanguages: 'ur,en,ar,hi,es,fr,de,tr,fa,bn,ru'
            }, 'google_translate_element');
        }

        // ========== SEARCH FUNCTION (سرچ بار) ==========
        function searchLanguage() {
            let searchLang = document.getElementById("language-search").value.trim();
            if (searchLang === "") {
                showStatus("⚠️ براہ کرم کوئی زبان لکھیں!", "error");
                return;
            }
            
            let select = document.querySelector('.goog-te-combo');
            if (select) {
                let found = false;
                for (let i = 0; i < select.options.length; i++) {
                    let optionText = select.options[i].text.toLowerCase();
                    let searchLower = searchLang.toLowerCase();
                    if (optionText.includes(searchLower) || searchLower.includes(optionText.split(' ')[0])) {
                        select.selectedIndex = i;
                        select.dispatchEvent(new Event('change'));
                        found = true;
                        showStatus("✅ زبان مل گئی! صفحہ ترجمہ ہو رہا ہے...", "success");
                        break;
                    }
                }
                if (!found) {
                    showStatus("⚠️ یہ زبان اس وقت دستیاب نہیں۔ براہ کرم دوسری زبان試してみてください۔", "error");
                }
            } else {
                showStatus("⏳ براہ کرم Google Translate کے لوڈ ہونے کا انتظار کریں۔", "info");
            }
        }

        // ========== SELECT DROPDOWN FUNCTION ==========
        function selectFromDropdown() {
            let selectedLang = document.getElementById("language-select").value;
            if (selectedLang === "") return;
            
            document.getElementById("language-search").value = selectedLang;
            
            let select = document.querySelector('.goog-te-combo');
            if (select) {
                let found = false;
                for (let i = 0; i < select.options.length; i++) {
                    let optionText = select.options[i].text.toLowerCase();
                    let searchLower = selectedLang.toLowerCase();
                    if (optionText.includes(searchLower) || searchLower.includes(optionText.split(' ')[0])) {
                        select.selectedIndex = i;
                        select.dispatchEvent(new Event('change'));
                        found = true;
                        showStatus("✅ زبان تبدیل ہو گئی! صفحہ ترجمہ ہو رہا ہے...", "success");
                        break;
                    }
                }
                if (!found) {
                    showStatus("⚠️ یہ زبان اس وقت دستیاب نہیں۔", "error");
                }
            }
        }

        // Trigger search when user types and presses Enter
        document.getElementById("language-search").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                searchLanguage();
            }
        });

        // ========== COPY FUNCTION (بدون alert) ==========
        function copyDemoText() {
            let text = document.querySelector('.demo-text p').innerText;
            let temp = document.createElement("textarea");
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            let success = false;
            try {
                success = document.execCommand("copy");
            } catch(e) {}
            document.body.removeChild(temp);
            
            let msgDiv = document.getElementById("copyMessage");
            if (success) {
                msgDiv.innerHTML = "✅ متن کامیابی سے کاپی ہو گیا!";
                msgDiv.style.color = "#00ff88";
                msgDiv.style.background = "rgba(0,255,100,0.15)";
                msgDiv.style.padding = "8px";
                msgDiv.style.borderRadius = "20px";
            } else {
                msgDiv.innerHTML = "❌ کاپی کرنے میں مسئلہ۔ براہ کرم دستی طور پر کاپی کریں۔";
                msgDiv.style.color = "#ff6666";
                msgDiv.style.background = "rgba(255,50,50,0.15)";
                msgDiv.style.padding = "8px";
                msgDiv.style.borderRadius = "20px";
            }
            setTimeout(() => {
                msgDiv.innerHTML = "";
                msgDiv.style.padding = "0";
            }, 3000);
        }
    </script>
    
    <!-- Google Translate Script -->
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
